# ============================================================
# Fitoscout · Пример конфигурации fitoscoutd
# Задача #1: обновлён под MariaDB (вместо SQLite)
#
# Скопируйте в /volume1/Fitoscout_project/config/config.toml
# и замените пароли/пути на реальные.
# ============================================================

[server]
host = "0.0.0.0"
port = 8443
read_timeout_sec = 30
write_timeout_sec = 30
shutdown_timeout_sec = 30

[tls]
# mTLS: сертификаты лежат на NAS (ADR-006)
cert_file = "/volume1/Fitoscout_project/certs/server.crt"
key_file = "/volume1/Fitoscout_project/certs/server.key"
ca_file = "/volume1/Fitoscout_project/certs/ca.crt"
revoked_file = "/volume1/Fitoscout_project/certs/revoked.txt"

[auth]
# Дополнительный заголовок верификации клиента
client_header = "X-Fitoscout-Client"
# Лимит запросов в минуту на один сертификат (0 - без лимита)
rate_limit_per_min = 120

[database]
# MariaDB DSN. Формат: user:pass@tcp(host:port)/db?parseTime=true&loc=UTC
dsn = "fitoscout:KfG6HrQ#~*yY?wG{Naty13mD@}@unix(/run/mysqld/mysqld10.sock)/fitoscout?parseTime=true&loc=UTC"
max_open_conns = 10
max_idle_conns = 5
# секунды
conn_max_lifetime = 3600

[cleanup]
# Автоочистка soft-deleted записей (ADR-008, фича 4)
enabled = true
# сколько дней хранить tombstones (нужны для дельта-синхронизации)
retention_days = 30
# периодичность запуска
interval_hours = 24
# первый запуск после старта приложения
first_delay_minutes = 5

[media]
# Фото записей: originals/thumbnails/icons/covers (ADR-009)
base_path = "/volume1/Fitoscout_project/media"
# Вечное хранилище книг и видео
library_path = "/volume2/Библиотека"

[logging]
# debug | info | warn | error
level = "info"
# stdout или путь к файлу
output = "/volume1/Fitoscout_project/logs/fitoscout.log"
max_size_mb = 10
max_files = 5